aid: cashify
name: Cashify
description: 'Cashify is an Indian re-commerce platform for buying, selling, and repairing
  used and refurbished consumer electronics — smartphones, laptops, tablets, and other
  gadgets. Founded in 2013 and headquartered in Gurugram, the company provides instant
  online price quotes, free doorstep pickup with on-the-spot payment for devices sold
  to it, and sells certified refurbished devices backed by warranty. Alongside its
  consumer website and mobile apps, Cashify operates a network of physical retail stores
  across India, runs device repair services, and offers a partner program for retailers.
  It is backed by Bessemer Venture Partners among other investors. This profile was
  added to the API Evangelist network as a company lead and has been enriched with
  identity and domain-security artifacts.'
